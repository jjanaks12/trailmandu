version: '3.8'

services:
  mysql:
    image: mysql:9.0
    container_name: trailmandu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cloud
      MYSQL_DATABASE: trailmandu
    ports:
      # Exposed on 3307 on the host to avoid conflicting with any local MySQL running on 3306
      - "3307:3306"
    volumes:
      # Persist MySQL data in a docker volume
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trailmandu-redis
    restart: always
    ports:
      # Exposed on 6380 on the host to avoid conflicting with any local Redis running on 6379
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trailmandu-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql://root:cloud@mysql:3306/trailmandu?connection_limit=10&pool_timeout=20&allowPublicKeyRetrieval=true&useSSL=false
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/src/resources/uploads:/app/dist/src/resources/uploads
    command: >
      sh -c "npx prisma migrate deploy && node dist/prisma/import-backup.js && npm run start"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trailmandu-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: trailmandu-notification
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./services/notification/.env
    environment:
      - DATABASE_URL=mysql://root:cloud@mysql:3306/trailmandu_notifications?connection_limit=10&pool_timeout=20&allowPublicKeyRetrieval=true&useSSL=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=cloud
      - DB_NAME=trailmandu_notifications
      - REDIS_URL=redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  api-gateway:
    image: nginx:alpine
    container_name: trailmandu-api-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - notification-service
volumes:
  mysql_data:
